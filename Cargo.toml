[package]
name = "peregrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native desktop TypeScript game runtime with V8 and WebGPU"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
getrandom = "0.3"
clap = { version = "4.5", features = ["derive"] }
deno_core = "=0.412.0"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_error = "=0.7.1"
deno_image = "=0.35.0"
deno_web = "=0.290.0"
deno_webgpu = "=0.226.0"
deno_webidl = "=0.259.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kira = { version = "=0.12.4", default-features = false, features = ["cpal", "cpal-realtime", "mp3", "ogg", "vorbis", "wav", "pcm"] }
gilrs = "=0.11.2"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "net", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "=0.30.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

