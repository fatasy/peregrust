name: Native runtime checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev mesa-vulkan-drivers xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Native integration with software Vulkan
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Agent control with real GPU readback
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:control
      - name: Build release executable
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: peregrust-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/peregrust
            target/release/peregrust.exe
          if-no-files-found: error
